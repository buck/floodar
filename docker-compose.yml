services:
  floodar-db:
    container_name: floodar-db
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - floodar-pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5

volumes:
  floodar-pgdata:
