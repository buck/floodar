apply plugin: 'com.android.application'

// Pull ARCore Geospatial API key from local.properties (not checked into git).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def arcoreApiKeyValue = localProps.getProperty('arcore.api.key', '')

android {
    namespace "com.compact.floodar"
    compileSdkVersion 36
    // Nix Android SDK is read-only; pin to what's actually installed instead
    // of letting AGP try to auto-install build-tools 34.0.0 into /nix/store.
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.compact.floodar"

        // AR Required apps must declare minSdkVersion >= 24.
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 1
        versionName '0.1'

        manifestPlaceholders = [arcoreApiKey: arcoreApiKeyValue]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ARCore (Google Play Services for AR) library.
    implementation 'com.google.ar:core:1.56.0'
    implementation 'com.google.android.gms:play-services-location:19.0.1'
    implementation 'com.google.android.gms:play-services-auth:19.0.0'

    // Obj - a simple Wavefront OBJ file loader
    // https://github.com/javagl/Obj
    implementation 'de.javagl:obj:0.4.0'

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'com.google.guava:guava:31.1-android'
}
